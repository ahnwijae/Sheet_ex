<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주보 결정 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 장부(ledger) — 상단 주차 바, 탭, 캐릭터 카드 그리드. 주간 결정=보라, 월간 결정=금색 */
:root{
  --bg:#f6f4f9; --surface:#ffffff; --sunk:#efebf5; --line:#ddd6e8;
  --fg:#1f1a2b; --muted:#6c6480;
  --accent:#6b3fc4; --accent-ink:#ffffff; --accent-soft:#ece4fb;
  --gold:#a86f00; --gold-soft:#fbefd2;
  --ok:#1f8a4c; --ok-soft:#dcf3e5; --warn:#b5541c; --warn-soft:#fbe6d8;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121c; --surface:#1e1a28; --sunk:#26202f; --line:#352d42;
  --fg:#ece8f4; --muted:#a39bb5;
  --accent:#a985f0; --accent-ink:#15121c; --accent-soft:#2e2445;
  --gold:#e3b04b; --gold-soft:#3a2d12;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#ef9a62; --warn-soft:#3b2416;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1e1a28; --sunk:#26202f; --line:#352d42;
  --fg:#ece8f4; --muted:#a39bb5;
  --accent:#a985f0; --accent-ink:#15121c; --accent-soft:#2e2445;
  --gold:#e3b04b; --gold-soft:#3a2d12;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#ef9a62; --warn-soft:#3b2416;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:400 30px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
h2{font-size:17px;margin:0 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--fg)}
.weekbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.weekbar .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:4px;margin:16px 0;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;font:500 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button,.btn{font:500 13px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 6px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:14px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type="number"]{width:64px}
input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--fg);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mcard .big{font:500 20px var(--f-num)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.party{background:var(--accent-soft);color:var(--accent)}
.pill.month{background:var(--gold-soft);color:var(--gold)}
.member{margin-bottom:26px}
.member-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.criteria{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--sunk);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.criteria label{display:flex;gap:6px;align-items:center;cursor:pointer}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.char.done{border-color:var(--ok)}
.char-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.meter{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.monthly td{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.addrow select{flex:1;min-width:140px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--warn);font-size:12.5px}
.matrix td.cell{text-align:center}
.yes{color:var(--ok);font-weight:700}
.nope{color:var(--muted)}
textarea{width:100%;min-height:120px;font:12px var(--f-num);background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.charpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.charpick label{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:0}
.charpick label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>주보 결정 장부</h1>
      <div class="muted small">넥슨 오픈 API 스케줄러 기준 · 결정 금액 = 판매가 ÷ 파티 인원(소수점 버림)</div>
    </div>
    <div class="weekbar">
      <div><div class="lbl">이번 주</div><div id="weekLabel" class="num"></div></div>
      <div><div class="lbl">초기화까지</div><div id="resetLeft" class="num"></div></div>
      <button class="primary" id="refreshAll">전체 새로고침</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="week" aria-selected="true">이번 주</button>
    <button role="tab" data-tab="party">파티보스</button>
    <button role="tab" data-tab="prices">결정 가격 · 파티 설정</button>
    <button role="tab" data-tab="members">멤버 · API</button>
    <button role="tab" data-tab="history">주간 기록</button>
  </nav>

  <div id="sampleBanner" class="banner" hidden>
    <span><b>예시 데이터</b>를 보고 있어요. 멤버 · API 탭에서 내 API 키를 넣으면 예시는 사라집니다.</span>
    <button id="clearSample">예시 지우기</button>
  </div>

  <section id="view-week"></section>
  <section id="view-party" hidden></section>
  <section id="view-prices" hidden></section>
  <section id="view-members" hidden></section>
  <section id="view-history" hidden></section>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- 결정 가격 (2026-10-22 적용 기준, 수정 가능) ---------- */
const CATALOG = [
 ["카오스","자쿰",4040000],["카오스","블러디퀸",4070000],["카오스","반반",4070000],["카오스","피에르",4080000],
 ["하드","매그너스",4280000],["카오스","벨룸",4640000],["카오스","파풀라투스",6550000],["노멀","스우",8350000],
 ["노멀","데미안",8750000],["노멀","가디언 엔젤 슬라임",12700000],["이지","루시드",14900000],["이지","윌",16100000],
 ["노멀","루시드",17800000],["노멀","윌",20500000],["노멀","더스크",22000000],["노멀","듄켈",23700000],
 ["하드","데미안",46400000],["하드","스우",48900000],["하드","루시드",59700000],["카오스","더스크",66300000],
 ["노멀","진 힐라",67600000],["카오스","가디언 엔젤 슬라임",71300000],["하드","윌",73200000],["하드","듄켈",89600000],
 ["하드","진 힐라",100000000],["노멀","선택받은 세렌",167000000],["이지","감시자 칼로스",238000000],
 ["이지","최초의 대적자",261000000],["하드","선택받은 세렌",302000000],["이지","카링",320000000],
 ["이지","벨로나",396000000],["노멀","감시자 칼로스",479000000],["노멀","최초의 대적자",532000000],
 ["익스트림","스우",545000000],["노멀","찬란한 흉성",576000000],["노멀","카링",593000000],["노멀","벨로나",824000000],
 ["노멀","림보",995000000],["카오스","감시자 칼로스",1230000000],["노멀","발드릭스",1320000000],
 ["하드","최초의 대적자",1390000000],["노멀","유피테르",1560000000],["하드","카링",1560000000],
 ["익스트림","선택받은 세렌",1840000000],["하드","림보",2385000000],["하드","찬란한 흉성",2678000000],
 ["하드","벨로나",2950000000],["하드","발드릭스",3078000000],["익스트림","감시자 칼로스",4104000000],
 ["익스트림","최초의 대적자",4712000000],["익스트림","카링",4845000000],["하드","유피테르",5387000000],
 ["익스트림","림보",7500000000],["익스트림","발드릭스",9600000000]
].map(([d,b,p])=>({key:b+"|"+d,boss:b,diff:d,price:p,cycle:"week"}))
.concat([["하드","검은 마법사",465000000],["익스트림","검은 마법사",5680000000]]
.map(([d,b,p])=>({key:b+"|"+d,boss:b,diff:d,price:p,cycle:"month"})));
const BY_KEY = Object.fromEntries(CATALOG.map(c=>[c.key,c]));
const PRICE_DATE = "2026-10-22";

/* ---------- 이름 정규화 (API 응답 ↔ 카탈로그) ---------- */
const DIFF_MAP = {easy:"이지",이지:"이지",normal:"노멀",노멀:"노멀",노말:"노멀",hard:"하드",하드:"하드",chaos:"카오스",카오스:"카오스",extreme:"익스트림",익스트림:"익스트림"};
const ALIAS = {"대적자":"최초의대적자","칼로스":"감시자칼로스","세렌":"선택받은세렌","흉성":"찬란한흉성","가엔슬":"가디언엔젤슬라임","블러디퀸":"블러디퀸","검마":"검은마법사","진힐라":"진힐라"};
const norm = s => String(s||"").replace(/\s+/g,"");
function matchKey(name, diff){
  const d = DIFF_MAP[norm(diff).toLowerCase()] || DIFF_MAP[norm(diff)];
  let n = norm(name).replace(/\(.*?\)/g,"");
  // 이름에 난이도가 붙어 오는 경우("하드 윌")
  let dd = d;
  for (const k of Object.keys(DIFF_MAP)) if (!dd && n.toLowerCase().startsWith(k)) { dd = DIFF_MAP[k]; n = n.slice(k.length); }
  n = ALIAS[n] || n;
  const hit = CATALOG.find(c => c.diff===dd && (norm(c.boss)===n || norm(c.boss).endsWith(n) || n.endsWith(norm(c.boss))));
  return hit ? hit.key : null;
}

/* ---------- 시간: 주간 초기화 목요일 0시 (KST) ---------- */
const KST = 9*3600e3;
function weekStart(ts=Date.now()){ const k=new Date(ts+KST); const dow=k.getUTCDay(); const back=(dow-4+7)%7;
  return Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate()-back)-KST; }
function weekKey(ts=Date.now()){ const k=new Date(weekStart(ts)+KST); return k.toISOString().slice(0,10); }
function monthKey(ts=Date.now()){ return new Date(ts+KST).toISOString().slice(0,7); }
function weekRange(wk){ const s=new Date(wk+"T00:00:00Z"); const e=new Date(s.getTime()+6*864e5);
  const f=d=>(d.getUTCMonth()+1)+"/"+d.getUTCDate(); return f(s)+"(목) ~ "+f(e)+"(수)"; }

/* ---------- 포맷 ---------- */
function meso(n){ n=Math.floor(n||0); if(n<1e4) return n.toLocaleString("ko-KR");
  const eok=Math.floor(n/1e8), man=Math.floor((n%1e8)/1e4);
  return (eok?eok.toLocaleString("ko-KR")+"억 ":"")+(man?man.toLocaleString("ko-KR")+"만":"").trim() || "0"; }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- 상태 ---------- */
const STORE="maple-boss-ledger.v1";
const CRITERIA = [
  ["w12","캐릭터마다 주간보스 12/12"],
  ["reg","스케줄러에 등록한 보스 모두 처치"],
  ["party","지정한 파티보스 모두 처치"],
  ["sold","결정 판매 체크"],
  ["month","월간보스(검은 마법사) 처치"]
];
function defaultState(){ return {prices:{},party:{},members:[],weeks:{},months:{},sample:true}; }
let S = load();
function load(){ try{ const raw=localStorage.getItem(STORE); if(raw){ return Object.assign(defaultState(),JSON.parse(raw)); } }catch(e){}
  const s=defaultState(); seedSample(s); return s; }
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){ toast("브라우저 저장소에 저장하지 못했어요"); } }
const priceOf = k => (S.prices[k] ?? BY_KEY[k]?.price ?? 0);
const partyOf = k => S.party[k] || {on:false,size:2};

function uid(){ return Math.random().toString(36).slice(2,9); }
function seedSample(s){
  s.sample=true;
  s.party={"카링|하드":{on:true,size:3},"림보|하드":{on:true,size:2},"검은 마법사|하드":{on:true,size:6}};
  const wk=weekKey(), mk=monthKey();
  const mk_=(name,chars,crit)=>({id:uid(),name,apiKey:"",sample:true,criteria:crit,chars});
  const c=(ocid,name,world,cls,level)=>({ocid,name,world,cls,level,track:true});
  s.members=[
    mk_("나 (예시)",[c("ex-1","예시본캐","스카니아","아크메이지(불,독)",285),c("ex-2","예시부캐","스카니아","나이트로드",270)],{w12:true,reg:false,party:true,sold:true,month:false}),
    mk_("친구 A (예시)",[c("ex-3","예시친구","스카니아","히어로",283)],{w12:true,reg:false,party:true,sold:false,month:false})
  ];
  const full12a=["카링|하드","림보|하드","찬란한 흉성|노멀","최초의 대적자|하드","감시자 칼로스|카오스","벨로나|노멀","카링|노멀","스우|익스트림","선택받은 세렌|하드","진 힐라|하드","듄켈|하드","윌|하드"];
  const part12b=["최초의 대적자|노멀","감시자 칼로스|노멀","선택받은 세렌|하드","진 힐라|하드","듄켈|하드","윌|하드","가디언 엔젤 슬라임|카오스","더스크|카오스","루시드|하드","스우|하드","데미안|하드"];
  const c3=["카링|하드","찬란한 흉성|노멀","최초의 대적자|하드","감시자 칼로스|카오스","벨로나|노멀","카링|노멀","스우|익스트림","선택받은 세렌|하드","진 힐라|하드","듄켈|하드"];
  s.weeks[wk]={
    "ex-1":{api:full12a,reg:full12a,count:12,limit:12,manual:{},size:{},sold:true,fetchedAt:Date.now()},
    "ex-2":{api:part12b,reg:part12b.concat(["카링|이지"]),count:11,limit:12,manual:{},size:{},sold:false,fetchedAt:Date.now()},
    "ex-3":{api:c3,reg:c3.concat(["림보|하드","윌|하드"]),count:10,limit:12,manual:{},size:{},sold:false,fetchedAt:Date.now()}
  };
  s.months[mk]={"ex-1":["검은 마법사|하드"]};
}
function clearSample(){
  S.members=S.members.filter(m=>!m.sample);
  for(const wk of Object.keys(S.weeks)) for(const o of Object.keys(S.weeks[wk])) if(o.startsWith("ex-")) delete S.weeks[wk][o];
  for(const mk of Object.keys(S.months)) for(const o of Object.keys(S.months[mk])) if(o.startsWith("ex-")) delete S.months[mk][o];
  if(S.sample){ S.party={}; } S.sample=false; save(); render();
}

/* ---------- 계산 ---------- */
function rec(ocid, wk=weekKey()){ S.weeks[wk]=S.weeks[wk]||{}; return S.weeks[wk][ocid]=S.weeks[wk][ocid]||{api:[],reg:[],count:null,limit:12,manual:{},size:{},sold:false}; }
function peek(ocid, wk=weekKey()){ return S.weeks[wk]?.[ocid]; }
function clearsOf(r){ if(!r) return []; const set=new Set(r.api||[]); for(const k in (r.manual||{})) if(r.manual[k]) set.add(k);
  return [...set].filter(k=>BY_KEY[k]&&BY_KEY[k].cycle==="week").sort((a,b)=>priceOf(b)-priceOf(a)); }
function sizeFor(r,k){ const o=r?.size?.[k]; if(o) return o; const p=partyOf(k); return p.on?Math.max(1,p.size|0):1; }
function share(r,k){ return Math.floor(priceOf(k)/sizeFor(r,k)); }
function charTotal(r){ return clearsOf(r).reduce((a,k)=>a+share(r,k),0); }
function monthClears(ocid, mk=monthKey()){ return (S.months[mk]?.[ocid]||[]).filter(k=>BY_KEY[k]); }
function monthShare(k){ const p=partyOf(k); return Math.floor(priceOf(k)/(p.on?Math.max(1,p.size|0):1)); }
function partyKeys(){ return CATALOG.filter(c=>partyOf(c.key).on).map(c=>c.key); }
function memberClears(m, wk=weekKey()){ const out={}; for(const ch of m.chars.filter(c=>c.track)){ for(const k of clearsOf(peek(ch.ocid,wk))) (out[k]=out[k]||[]).push(ch.name);
  if(wk===weekKey()) for(const k of monthClears(ch.ocid)) (out[k]=out[k]||[]).push(ch.name); } return out; }

function charChecks(m, ch, wk=weekKey()){
  const r=peek(ch.ocid,wk), cl=clearsOf(r), res=[];
  if(m.criteria.w12) res.push(["주간 12",cl.length>=12]);
  if(m.criteria.reg){ const reg=(r?.reg||[]).filter(k=>BY_KEY[k]?.cycle==="week"); res.push(["등록 보스", reg.length>0 && reg.every(k=>cl.includes(k))]); }
  if(m.criteria.sold) res.push(["결정 판매", !!r?.sold]);
  return res;
}
function memberChecks(m, wk=weekKey()){
  const res=[], mc=memberClears(m,wk);
  if(m.criteria.party){ const pk=partyKeys().filter(k=>BY_KEY[k].cycle==="week"); res.push(["파티보스", pk.length>0 && pk.every(k=>mc[k])]); }
  if(m.criteria.month && wk===weekKey()){ res.push(["월간보스", m.chars.some(c=>c.track && monthClears(c.ocid).length)]); }
  return res;
}
function memberDone(m, wk=weekKey()){
  const chars=m.chars.filter(c=>c.track);
  const any = CRITERIA.some(([k])=>m.criteria[k]);
  if(!any || !chars.length) return null;
  return chars.every(c=>charChecks(m,c,wk).every(x=>x[1])) && memberChecks(m,wk).every(x=>x[1]);
}

/* ---------- API ---------- */
const API="https://open.api.nexon.com/maplestory/v1";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,key){
  const res=await fetch(API+path,{headers:{"x-nxopen-api-key":key}});
  let body=null; try{ body=await res.json(); }catch(e){}
  if(!res.ok){ const code=body?.error?.name||res.status; const msg=body?.error?.message||"";
    const hint={OPENAPI00005:"API 키가 올바르지 않아요",OPENAPI00002:"이 키로는 조회 권한이 없어요(계정 API 키인지 확인)",OPENAPI00007:"호출이 너무 많아요. 잠시 후 다시 시도하세요",OPENAPI00009:"아직 데이터가 준비되지 않았어요",OPENAPI00010:"넥슨 API 점검 중이에요",OPENAPI00011:"넥슨 API 점검 중이에요"}[code];
    throw new Error((hint||"요청 실패")+" ("+code+(msg&&!hint?": "+msg:"")+")"); }
  return body;
}
async function loadCharacters(m){
  const data=await api("/character/list",m.apiKey);
  const list=(data.account_list||[]).flatMap(a=>a.character_list||[]);
  const old=Object.fromEntries(m.chars.map(c=>[c.ocid,c]));
  m.chars=list.map(c=>({ocid:c.ocid,name:c.character_name,world:c.world_name,cls:c.character_class,level:c.character_level,
    track: old[c.ocid] ? old[c.ocid].track : (c.character_level||0)>=260 }))
    .sort((a,b)=>(b.level||0)-(a.level||0));
}
async function loadScheduler(m,ch){
  const d=await api("/scheduler/character-state?ocid="+encodeURIComponent(ch.ocid),m.apiKey);
  const items=d.boss_contents||d.boss_content||[];
  const r=rec(ch.ocid); const api_=[], reg=[], unknown=[], monthly=[];
  for(const it of items){
    const cyc=String(it.cycle||"").toLowerCase();
    if(cyc.includes("daily")||cyc.includes("일")) continue;
    const k=matchKey(it.content_name,it.difficulty);
    const done=String(it.complete_flag)==="true", isReg=String(it.registration_flag)==="true";
    if(!k){ if(done) unknown.push((it.difficulty||"")+" "+(it.content_name||"")); continue; }
    if(BY_KEY[k].cycle==="month"){ if(done) monthly.push(k); continue; }
    if(done) api_.push(k); if(isReg) reg.push(k);
  }
  r.api=api_; r.reg=reg; r.unknown=unknown; r.fetchedAt=Date.now();
  if(d.weekly_boss_clear_count!=null) r.count=+d.weekly_boss_clear_count;
  if(d.weekly_boss_clear_limit_count!=null) r.limit=+d.weekly_boss_clear_limit_count;
  const mk=monthKey(); S.months[mk]=S.months[mk]||{}; S.months[mk][ch.ocid]=monthly;
}
let busy=false;
async function refreshMember(m){
  if(!m.apiKey){ return {err:"API 키가 없어요"}; }
  m.error="";
  try{
    if(!m.chars.length) await loadCharacters(m);
    for(const ch of m.chars.filter(c=>c.track)){ await loadScheduler(m,ch); await sleep(250); }
    m.updatedAt=Date.now();
  }catch(e){ m.error = e.message.includes("Failed to fetch") ? "넥슨 API에 연결하지 못했어요. 파일을 웹 주소(로컬 서버나 GitHub Pages)로 열었는지 확인하세요." : e.message; }
  save(); return {err:m.error};
}
async function refreshAll(){
  if(busy) return; const real=S.members.filter(m=>!m.sample&&m.apiKey);
  if(!real.length){ toast("API 키가 등록된 멤버가 없어요"); switchTab("members"); return; }
  busy=true; const b=document.getElementById("refreshAll"); b.disabled=true; b.textContent="불러오는 중…";
  let errs=0; for(const m of real){ const r=await refreshMember(m); if(r.err) errs++; render(); }
  busy=false; b.disabled=false; b.textContent="전체 새로고침";
  toast(errs?"일부 멤버를 불러오지 못했어요":"이번 주 기록을 갱신했어요");
}

function pill(ok,label){ return `<span class="pill ${ok?"ok":"no"}">${ok?"✓":"✕"} ${esc(label)}</span>`; }

  if(!S.members.length){ el.innerHTML=`<div class="panel"><h2>멤버가 없어요</h2><p class="muted">멤버 · API 탭에서 나와 친구의 이름과 API 키를 추가하세요.</p><button class="primary" data-go="members">멤버 추가하러 가기</button></div>`; return; }

  let html=`<div class="summary">`;
  for(const m of S.members){
    const chars=m.chars.filter(c=>c.track);
    const tot=chars.reduce((a,c)=>a+charTotal(peek(c.ocid,wk)),0);

  }
  html+=`</div>`;
  for(const m of S.members){
    const chars=m.chars.filter(c=>c.track);
    html+=`<div class="member" data-mid="${m.id}"><div class="member-head"><h2 style="margin:0">${esc(m.name)}</h2>`;
    for(const [l,ok] of memberChecks(m)) html+=pill(ok,l);

    for(const [k,l] of CRITERIA) html+=`<label><input type="checkbox" data-crit="${k}" ${m.criteria[k]?"checked":""}> ${l}</label>`;
    html+=`</div>`;
    if(!chars.length){ html+=`<p class="muted">추적할 캐릭터가 없어요. 멤버 · API 탭에서 캐릭터를 고르세요.</p></div>`; continue; }
    html+=`<div class="chars">`;
    for(const ch of chars){
      const r=peek(ch.ocid,wk), cl=clearsOf(r), checks=charChecks(m,ch);
      const done=checks.length? checks.every(x=>x[1]) : false;
      const lim=r?.limit||12, cnt=Math.max(cl.length, r?.count||0);
      html+=`<div class="char ${done?"done":""}" data-ocid="${esc(ch.ocid)}">
        <div class="char-head"><div style="min-width:0"><h3>${esc(ch.name)}</h3><div class="muted small">${esc(ch.world||"")} · ${esc(ch.cls||"")} · Lv.${ch.level||"?"}</div></div>
        <div style="text-align:right"><div class="num" style="font-size:16px">${meso(charTotal(r))}</div><div class="muted small num">${cnt}/${lim}</div></div></div>
        <div class="meter" aria-hidden="true"><i style="width:${Math.min(100,cnt/lim*100)}%"></i></div>
        <div class="row">${checks.map(([l,ok])=>pill(ok,l)).join("")}
          <label class="small" style="display:flex;gap:6px;align-items:center;margin-left:auto"><input type="checkbox" data-act="sold" ${r?.sold?"checked":""}> 결정 판매함</label></div>
        <div class="tbl-wrap"><table><thead><tr><th>보스</th><th class="r">인원</th><th class="r">1인 금액</th><th></th></tr></thead><tbody>`;

          <td class="r"><input type="number" min="1" max="6" value="${sizeFor(r,k)}" data-act="size" data-key="${esc(k)}" aria-label="${esc(c.boss)} 파티 인원"></td>
          <td class="r num">${meso(share(r,k))}</td>
          <td class="r">${manual?`<button class="ghost" data-act="unmanual" data-key="${esc(k)}" title="수동 체크 해제">✕</button>`:`<span class="muted small" title="넥슨 API로 확인됨">API</span>`}</td></tr>`;
      }
      for(const k of monthClears(ch.ocid)){ const c=BY_KEY[k];
        html+=`<tr class="monthly"><td>${esc(c.diff)} ${esc(c.boss)} <span class="pill month">월간</span></td><td class="r num">${partyOf(k).on?partyOf(k).size:1}</td><td class="r num">${meso(monthShare(k))}</td><td></td></tr>`; }

        CATALOG.filter(c=>c.cycle==="week"&&!cl.includes(c.key)).sort((a,b)=>b.price-a.price).map(c=>`<option value="${esc(c.key)}">${esc(c.diff+" "+c.boss)} · ${meso(c.price)}</option>`).join("")+
        `</select><button data-act="addmanual">추가</button></div></div>`;
    }
    html+=`</div></div>`;
  }
  el.innerHTML=html;
}

    for(const ch of m.chars) html+=`<label title="${esc(ch.world+" · "+ch.cls)}"><input type="checkbox" data-act="track" data-ocid="${esc(ch.ocid)}" ${ch.track?"checked":""}><span><b>${esc(ch.name)}</b> <span class="muted small">Lv.${ch.level} ${esc(ch.cls||"")} · ${esc(ch.world||"")}</span></span></label>`;
    if(!m.chars.length) html+=`<span class="muted">캐릭터가 없어요.</span>`;
    html+=`</div></div>`;
  }
  el.innerHTML=html;
  document.getElementById("addMember").addEventListener("click",async()=>{
    const name=document.getElementById("newName").value.trim(), key=document.getElementById("newKey").value.trim(), err=document.getElementById("addErr");
    if(!name||!key){ err.textContent="이름과 API 키를 모두 넣어 주세요."; return; }
    if(S.members.some(m=>m.sample)) clearSample();
    const m={id:uid(),name,apiKey:key,criteria:{w12:true,reg:false,party:true,sold:false,month:false},chars:[]};
    err.textContent="캐릭터를 불러오는 중…";
    try{ await loadCharacters(m); S.members.push(m); save(); err.textContent=""; toast(name+" 캐릭터 "+m.chars.length+"개를 불러왔어요"); renderMembers(); refreshMember(m).then(render); }
    catch(e){ err.textContent = e.message.includes("Failed to fetch")?"넥슨 API에 연결하지 못했어요. 파일을 웹 주소(로컬 서버나 GitHub Pages)로 열었는지 확인하세요.":e.message; }
  });
}

function renderHistory(){
  const el=document.getElementById("view-history");
  const wks=Object.keys(S.weeks).filter(wk=>Object.keys(S.weeks[wk]).length).sort().reverse();
  let html=`<div class="panel"><h2>주간 기록</h2><p class="note">넥슨 API는 이번 주 상태만 알려줘요. 이 페이지는 새로고침할 때마다 그 주 기록을 저장해 두니, 매주 수요일 밤(초기화 전)에 한 번 새로고침하면 지난주 기록이 정확히 남아요.</p>`;
  if(!wks.length) html+=`<p class="muted">저장된 기록이 없어요.</p>`;
  else{
    html+=`<div class="tbl-wrap"><table><thead><tr><th>주차</th>${S.members.map(m=>`<th class="r">${esc(m.name)}</th>`).join("")}<th class="r">합계</th></tr></thead><tbody>`;
    for(const wk of wks){ let sum=0;
      html+=`<tr><td>${weekRange(wk)}${wk===weekKey()?` <span class="pill party">이번 주</span>`:""}</td>`;
      for(const m of S.members){ const chars=m.chars.filter(c=>c.track); const t=chars.reduce((a,c)=>a+charTotal(peek(c.ocid,wk)),0); sum+=t;
        const n=chars.reduce((a,c)=>a+clearsOf(peek(c.ocid,wk)).length,0); const d=memberDone(m,wk);
        html+=`<td class="r"><div class="num">${meso(t)}</div><div class="small muted">${n}마리 ${d==null?"":d?`<span class="yes">완료</span>`:"미완료"}</div></td>`; }
      html+=`<td class="r num"><b>${meso(sum)}</b></td></tr>`; }
    html+=`</tbody></table></div>`;
  }
  html+=`</div><div class="panel"><h2>백업 · 공유</h2><p class="note">내보내기에는 API 키가 빠져요. 친구가 내보낸 내용을 붙여넣고 가져오면 그 친구의 멤버와 기록이 합쳐져요.</p>
    <div class="row" style="margin-bottom:8px"><button id="doExport">내보내기</button><button id="doImport">가져오기</button><button id="copyExport">복사</button></div>
    <textarea id="io" aria-label="내보내기·가져오기 데이터" placeholder="여기에 내보낸 데이터가 나오거나, 받은 데이터를 붙여넣어요"></textarea><div id="ioMsg" class="note"></div></div>`;
  el.innerHTML=html;
  const io=document.getElementById("io"), msg=document.getElementById("ioMsg");
  document.getElementById("doExport").onclick=()=>{ const c=JSON.parse(JSON.stringify(S)); c.members.forEach(m=>{m.apiKey="";m.error="";}); io.value=JSON.stringify(c); msg.textContent="API 키를 뺀 데이터예요."; };
  document.getElementById("copyExport").onclick=()=>{ if(!io.value) return; navigator.clipboard?.writeText(io.value).then(()=>toast("복사했어요"),()=>{io.select();toast("텍스트를 선택했어요. Ctrl+C로 복사하세요");}); };
  document.getElementById("doImport").onclick=()=>{
    try{ const d=JSON.parse(io.value); let added=0;
      for(const m of d.members||[]){ if(m.sample) continue; const ex=S.members.find(x=>x.name===m.name);
        if(ex){ ex.chars=m.chars; ex.criteria=m.criteria; } else { S.members.push(Object.assign(m,{id:uid(),apiKey:""})); added++; } }
      for(const wk in d.weeks||{}){ S.weeks[wk]=S.weeks[wk]||{}; for(const o in d.weeks[wk]) if(!o.startsWith("ex-")) S.weeks[wk][o]=d.weeks[wk][o]; }
      for(const mk in d.months||{}){ S.months[mk]=S.months[mk]||{}; for(const o in d.months[mk]) if(!o.startsWith("ex-")) S.months[mk][o]=d.months[mk][o]; }
      if(S.members.some(m=>!m.sample) && S.members.some(m=>m.sample)) clearSample();
      save(); msg.textContent="가져왔어요. 새 멤버 "+added+"명."; render();
    }catch(e){ msg.textContent="데이터 형식이 맞지 않아요. 내보내기로 만든 텍스트 전체를 붙여넣어 주세요."; }
  };
}

function render(){ header();
  if(tab==="week") renderWeek(); else if(tab==="party") renderParty(); else if(tab==="prices") renderPrices();
  else if(tab==="members") renderMembers(); else renderHistory(); }

/* ---------- 이벤트 ---------- */
const memberOf = el => S.members.find(m=>m.id===el.closest("[data-mid]")?.dataset.mid);
document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]"); if(go){ switchTab(go.dataset.go); return; }
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act; const m=memberOf(b);
  const card=b.closest("[data-ocid]");
  if(act==="refresh-member"&&m){ b.disabled=true; b.textContent="불러오는 중…"; const r=await refreshMember(m); render(); toast(r.err?"불러오지 못했어요":m.name+" 갱신 완료"); }
  if(act==="addmanual"&&card){ const k=card.querySelector("[data-role=manualpick]").value; if(!k) return; const r=rec(card.dataset.ocid); r.manual[k]=true; save(); render(); }
  if(act==="unmanual"&&card){ const r=rec(card.dataset.ocid); delete r.manual[b.dataset.key]; save(); render(); }
  if(act==="delmember"&&m){ if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="한 번 더 누르면 삭제"; return; }
    S.members=S.members.filter(x=>x!==m); save(); render(); }
  if(act==="reloadchars"&&m){ b.disabled=true; try{ await loadCharacters(m); m.error=""; save(); toast("캐릭터 목록을 갱신했어요"); }catch(err){ m.error=err.message; } render(); }
  if(act==="resetprices"){ if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="한 번 더 누르면 초기화"; return; } S.prices={}; save(); render(); toast("기본 가격으로 돌렸어요"); }
});
document.addEventListener("change",e=>{
  const t=e.target; const m=memberOf(t);
  if(t.dataset.crit&&m){ m.criteria[t.dataset.crit]=t.checked; save(); render(); return; }
  const act=t.dataset.act; if(!act) return; const card=t.closest("[data-ocid]");
  if(act==="sold"&&card){ rec(card.dataset.ocid).sold=t.checked; save(); render(); }
  if(act==="size"&&card){ const v=Math.max(1,Math.min(6,parseInt(t.value)||1)); rec(card.dataset.ocid).size[t.dataset.key]=v; save(); render(); }
  if(act==="track"&&m){ const ch=m.chars.find(c=>c.ocid===t.dataset.ocid); if(ch){ ch.track=t.checked; save(); } }
  if(act==="key"&&m){ m.apiKey=t.value.trim(); save(); toast("API 키를 저장했어요"); }
  const row=t.closest("tr[data-key]");
  if(row){ const k=row.dataset.key;
    if(act==="price"){ const v=parseInt(t.value.replace(/[^\d]/g,"")); if(!isNaN(v)){ if(v===BY_KEY[k].price) delete S.prices[k]; else S.prices[k]=v; } }
    if(act==="party"){ const p=Object.assign({size:2},S.party[k]); p.on=t.checked; S.party[k]=p; }
    if(act==="psize"){ const p=partyOf(k); S.party[k]={on:p.on,size:Math.max(1,Math.min(6,parseInt(t.value)||1))}; }
    save(); renderPrices(); }
});
document.getElementById("refreshAll").addEventListener("click",refreshAll);
document.getElementById("clearSample").addEventListener("click",clearSample);
setInterval(header,60000);
render();
</script>
</body>
